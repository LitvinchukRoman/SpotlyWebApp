global:
  scrape_interval:     15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'SpotlyWebApp'

rule_files:
  - 'node-exporter.yml'

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['10.0.1.252:9100', 'localhost:9100']
