replicaCount: 2
image:
  repository: litvinchukroman/spotly-backend
  pullPolicy: IfNotPresent
  tag: "0.0.1"

resources:
   limits:
     cpu: 500m
     memory: 1024Mi
   requests:
     cpu: 100m
   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true
