replicaCount: 2
namespace: backend
image:
  repository: litvinchukroman/spotly-backend
  pullPolicy: IfNotPresent
  tag: "0.0.2"
port: 8080

service:
  port: 8080
  metricsPath: /actuator/prometheus

resources:
   limits:
     cpu: 500m
     memory: 1024Mi
   requests:
     cpu: 100m
     memory: 128Mi

livenessProbe:
  initialDelaySeconds: 20
  httpGet:
    path: /actuator/health/liveness

readinessProbe:
  initialDelaySeconds: 20
  httpGet:
    path: /actuator/health/readiness

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
# - name: spring
#   secret:
#     secretName: mysecret
#     optional: false

volumeMounts: []
# - name: foo
#   mountPath: "/etc/spring"
#   readOnly: true

# Later to move AWS secrets in secret
env:
  SPRING_PROFILES_ACTIVE: dev
  AWS_ACCESS_KEY_ID: "1352436243512"
  AWS_SECRET_ACCESS_KEY: "123512324123"
