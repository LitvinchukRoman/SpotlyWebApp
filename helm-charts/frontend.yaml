replicaCount: 2
namespace: frontend
image:
  repository: litvinchukroman/spotly-frontend
  pullPolicy: IfNotPresent
  tag: "0.0.1"

sidecar:
  enabled: true
  image:
    repository: nginx/nginx-prometheus-exporter
    pullPolicy: IfNotPresent
    tag: "1.5.0"
  scrapeUri: "http://localhost/stub_status"

service:
  port: 9113
  portName: metrics
  metricsPath: /metrics

serviceForFrontend:
  enabled: true

ingress:
  enabled: true
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: spotly.mylabstep.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

configMap:
  enabled: true
  serverName: spotly.mylabstep.com
  backendUrl: "http://backend-app.backend:8080"
