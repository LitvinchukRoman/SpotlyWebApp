services:
  frontend:
    build: .
    ports:
      - "80:80"
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/index.html" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - spotlynet

  node_exporter:
    image: prom/node-exporter:v1.7.0
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    ports:
      - "9100:9100"
    networks:
      - spotlynet

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: always
    networks:
      - spotlynet

networks:
  spotlynet:
    driver: bridge
