services:
  backend:
    image: litvinchukroman/spotly-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL
      - DB_USERNAME
      - DB_PASSWORD
      - JWT_SECRET_KEY
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - AWS_ACCESS_KEY_ID=1352436243512
      - AWS_SECRET_ACCESS_KEY=123512324123
    restart: always
    volumes:
      - ./logs:/app/logs
    networks:
      - spotlynet

  frontend:
    image: litvinchukroman/spotly-frontend:latest
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    restart: always
    networks:
      - spotlynet

networks:
  spotlynet:
    driver: bridge

