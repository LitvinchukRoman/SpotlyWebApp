server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

#local machine logs
scrape_configs:
  - job_name: local
    static_configs:
      - targets:
           - localhost:8080
        labels:
          job: spring-boot
          app: backend
          __path__: /var/log/app/*.log
