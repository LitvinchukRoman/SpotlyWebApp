name: Frontend Build and Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy_frontend.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate React/TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Change directory
        run: cd Frontend/spotly-web-app

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript
        run: npm run typecheck

  deploy:
    runs-on: [ self-hosted, Linux, X64, frontend ]
    needs: validate
    steps:
      - name: deploy containers
        run: |
          cd /home/${{ secrets.SSH_USER }}/SpotlyWebApp
          git pull 
          git switch develop
          cd Frontend

          echo "Starting Docker Compose..."
          docker compose down
          docker compose up -d --build
