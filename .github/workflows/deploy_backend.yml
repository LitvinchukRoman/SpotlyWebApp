name: Build & Deploy Spring Boot App

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'    
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Spring Boot app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./backend  
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: backend/target/*.jar  

  deploy:
    name: Deploy Spring Boot app
    runs-on: [self-hosted, Linux, X64, frontend]
    needs: build
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: ./app

      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "app/*.jar"
          target: "/home/${{ secrets.SSH_USER }}/app/backend.jar"

      - name: Restart Spring Boot systemd service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Reloading systemd daemon..."
            sudo systemctl daemon-reload

            echo "Restarting backend service..."
            sudo systemctl restart springboot-backend.service

            echo "Checking service status..."
            sudo systemctl status springboot-backend.service --no-pager -l