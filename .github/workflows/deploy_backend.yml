name: Build & Deploy Spring Boot App

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'    
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spotly-backend:${{ github.sha }} ./backend

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/spotly-backend:${{ github.sha }}


  deploy:
    runs-on: [ self-hosted, Linux, X64, frontend ]
    needs: build
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            cd /home/${{ secrets.SSH_USER }}/app
            
            echo "Pulling latest Docker image..."
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/spotly-backend:${{ github.sha }}
            
            echo "Exporting environment variables..."
            export DB_URL='${{ secrets.DB_URL }}'
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}'
            export SPRING_PROFILES_ACTIVE=dev
            
            echo "Starting Docker Compose..."
            docker compose -f docker-compose.yml up -d