name: Build & Deploy Spring Boot App

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'    
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Spring Boot app
    runs-on: [self-hosted, Linux, X64, backend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: ./backend  
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: backend/target/*.jar  

  deploy:
    name: Deploy Spring Boot app
    runs-on: [self-hosted, Linux, X64, frontend]
    needs: build
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: ./app

      - name: Stop old instance (if running)
        run: |
          if pgrep -f 'spring-boot-app'; then
            echo "Stopping old Spring Boot process..."
            pkill -f 'spring-boot-app'
            sleep 3
          else
            echo "No running process found."
          fi

      - name: Start new Spring Boot app
        run: |
          echo "Starting new Spring Boot instance..."
          nohup java -jar ./app/*.jar > backend.log 2>&1 &
          sleep 5
          echo "App started successfully!"