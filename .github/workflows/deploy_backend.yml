name: Build & Deploy Spring Boot App

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'    
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spotly/backend:${{ github.sha }} ./backend

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar

  deploy:
    runs-on: [ self-hosted, Linux, X64, frontend ]
    needs: build
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: ./backend

      - name: Copy image & compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
            host: ${{ secrets.SSH_HOST }}
            username: ${{ secrets.SSH_USER }}
            key: ${{ secrets.SSH_KEY }}
            source: |
              backend.tar
              backend/docker-compose.yml
            target: /home/${{ secrets.SSH_USER }}/app/

      - name: Run Docker Compose on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/app

            echo "Loading Docker image..."
            docker load -i backend.tar

            echo "Pulling environment variables..."
            export DB_URL='${{ secrets.DB_URL }}'
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}'
            export SPRING_PROFILES_ACTIVE=dev

            echo "Starting Docker Compose..."
            docker compose -f docker-compose.yml up -d

            echo "Cleanup..."
            rm backend.tar
            echo "Deployment complete!"